<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>エルピーヤ</title>
<style>
  /* 公開LPビューア。LP本体のHTML（スナップショット）を iframe に描き、
     表示・CTAクリック・LINE追加のイベントだけを記録する */
  html, body { margin: 0; padding: 0; height: 100%; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .state {
    font-family: -apple-system, system-ui, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
    color: #555; text-align: center; padding: 80px 24px;
  }
</style>
</head>
<body>
<div class="state" id="state">読み込んでいます…</div>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://yyxbtoekzarbsrtdqwzn.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5eGJ0b2VremFyYnNydGRxd3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjgzMDgsImV4cCI6MjEwMjA0NDMwOH0.XVA9w7vpdo0vv1q9mvbofNs6AWMLUf95OSzq2bSbYUk';

  function rpc(name, args) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: 'Bearer ' + ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args)
    }).then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      return res.text().then(function (text) { return text ? JSON.parse(text) : null; });
    });
  }

  var slug = new URLSearchParams(window.location.search).get('lp') || '';
  var stateNode = document.getElementById('state');
  if (!slug) { stateNode.textContent = 'このURLは無効です。'; return; }

  function track(event) {
    /* 計測は表示を妨げない（失敗してもLPは見せる） */
    rpc('elpiya_track_lp_event', { p_slug: slug, p_event: event }).catch(function () {});
  }

  rpc('elpiya_public_lp', { p_slug: slug }).then(function (data) {
    if (!data || !data.html) {
      stateNode.textContent = 'このページは公開されていないか、公開が終了しました。';
      return;
    }
    if (data.title || data.headline) { document.title = data.title || data.headline; }

    var frame = document.createElement('iframe');
    /* 中の JS を動かす。KVのスライドもメールの登録も、ページの中の小さな
       JS で動いている。allow-same-origin は付けない（付けると枠の意味が
       無くなる）。そのぶん、親から中の document には触れないので、
       クリックは中から知らせてもらう（lp-render の frameReportJs）。
       実測 2026-10-04: allow-scripts が無く、矢印を押しても動かなかった */
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms');
    /* メール登録の宛先を、いま開いているページの名前にそろえる。
       HTMLを組むのは公開より前なので、その時点では公開URLの名前がまだ
       決まっていない。組んだときの名前（shop_slug/層）のまま焼かれていて、
       公開で別の名前が付くと、登録が「登録できませんでした」で弾かれる
       （実測 2026-10-11: ページは shlebru/a を送るのに、公開された名前は
       d0456cd4… だった）。ここで差し替えれば、公開済みのページも直る */
    frame.srcdoc = String(data.html || '')
      .replace(/p_slug:"[^"]*"/g, 'p_slug:' + JSON.stringify(slug));
    stateNode.remove();
    document.body.appendChild(frame);

    track('view');

    /* クリック計測。中の JS が種類だけを知らせてくる。
       1種類につき1回だけ送る */
    var sent = {};
    window.addEventListener('message', function (event) {
      var m = event && event.data;
      if (!m || m.lpya !== 1) { return; }
      if (event.source !== frame.contentWindow) { return; }
      if (m.kind !== 'click') { return; }
      var what = (m.what === 'line_add') ? 'line_add' : 'cta_click';
      if (sent[what]) { return; }
      sent[what] = true;
      track(what);
    });
  }).catch(function (err) {
    stateNode.textContent = '読み込みに失敗しました。時間をおいて再度お試しください。';
    console.error(err);
  });
})();
</script>
</body>
</html>
